name: M18 native compatibility evidence (online blocked)
on:
  push:
    branches: ['feature/m18-eos-compatibility-gate']
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            asset: win64.exe.zip
            executable: Godot_v4.7.2-stable_win64_console.exe
          - os: ubuntu-24.04
            platform: linux
            asset: linux.x86_64.zip
            executable: Godot_v4.7.2-stable_linux.x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch official pinned engine and EOSG candidate for internal evaluation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .tools/m18 | Out-Null
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          $asset = 'Godot_v4.7.2-stable_${{ matrix.asset }}'
          Invoke-WebRequest "$base/SHA512-SUMS.txt" -OutFile .tools/m18/engine-sums.txt
          Invoke-WebRequest "$base/$asset" -OutFile .tools/m18/engine.zip
          $entry = @(Get-Content .tools/m18/engine-sums.txt | Where-Object { ($_ -split '\s+')[-1].TrimStart('*') -eq $asset })
          if ($entry.Count -ne 1 -or (Get-FileHash .tools/m18/engine.zip -Algorithm SHA512).Hash -ne ($entry[0] -split '\s+')[0]) { throw 'M18_ENGINE_CHECKSUM_FAIL' }
          Expand-Archive .tools/m18/engine.zip .tools/m18/engine
          $candidate = 'epic-online-services-godot-${{ matrix.platform }}-e84320567a3a17d305478f5796707e69d2bdac4f.zip'
          Invoke-WebRequest "https://github.com/3ddelano/epic-online-services-godot/releases/download/2.3.0/$candidate" -OutFile .tools/m18/candidate.zip
          ./dev_tools/inspect_eosg_candidate.ps1 -Platform '${{ matrix.platform }}' -Archive .tools/m18/candidate.zip
      - name: Linux native dependency inventory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x .tools/m18/engine/Godot_v4.7.2-stable_linux.x86_64
          uname -a
          ldd --version
          cat /etc/os-release
          unzip -q .tools/m18/candidate.zip -d .tools/m18/audit
          find .tools/m18/audit \( -name '*x86_64.so' -o -name 'libEOSSDK-Linux-Shipping.so' \) -exec file {} \; -exec readelf -d {} \;
      - name: Twenty independent headless native starts and shutdowns
        shell: pwsh
        run: |
          $engine = Join-Path $pwd '.tools/m18/engine/${{ matrix.executable }}'
          $importOutput = (& $engine --headless --path . --import 2>&1 | Out-String)
          $importExit = $LASTEXITCODE
          Write-Output $importOutput
          if ($importExit -ne 0 -or $importOutput -match 'SCRIPT ERROR:|ERROR:|Parse Error|WARNING:') { throw 'M18_COLD_IMPORT_FAIL' }
          $policyOutput = (& $engine --headless --path . --script tests/eos_adapter_test.gd 2>&1 | Out-String)
          $policyExit = $LASTEXITCODE
          Write-Output $policyOutput
          if ($policyExit -ne 0 -or $policyOutput -match 'SCRIPT ERROR:|ERROR:|Parse Error|WARNING:' -or $policyOutput -notmatch 'PROJECTVELOCITY_M19_POLICY_OK live=false native=false') { throw 'M19_POLICY_FAIL' }
          ./dev_tools/test_eosg_native.ps1 -Godot $engine -Platform '${{ matrix.platform }}' -Archive .tools/m18/candidate.zip
          ./dev_tools/test_eosg_native.ps1 -Godot $engine -Platform '${{ matrix.platform }}' -Archive .tools/m18/candidate.zip -Repetitions 3 -InvalidPlatform
          ./dev_tools/test_eosg_launcher.ps1 -Archive .tools/m18/candidate.zip -Platform '${{ matrix.platform }}'
      - name: Gate boundary
        shell: pwsh
        run: |
          Write-Output 'M18_VERDICT=BLOCKED; this job proves only native load/API/global lifecycle/invalid-platform rejection.'
          Write-Output 'No configured platform tick, online identity, Lobby, P2P, native export or SteamOS certification is implied.'
      - name: Upload sanitized text evidence only (never proprietary binaries or user caches)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: M18-${{ matrix.platform }}-native-evidence
          retention-days: 30
          path: |
            builds/validation/m18-native-*/*.stdout.log
            builds/validation/m18-native-*/*.stderr.log
            builds/validation/m18-native-*/archive.json
          if-no-files-found: warn
